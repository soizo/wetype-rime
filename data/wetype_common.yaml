# Rime shared settings. Personal overrides: wetype_common.custom.yaml.
# encoding: utf-8

__patch: wetype_common.custom:/patch?

base:
  engine:
    processors:
      - lua_processor@*wetype_bootstrap
      - ascii_composer
      - recognizer
      - lua_processor@*wetype_candidate_rules*processor
      - key_binder
      - wetype_speller
      - punctuator
      - selector
      - navigator
      - express_editor
    segmentors:
      - ascii_segmentor
      - matcher
      - wetype_segmentor
      - punct_segmentor
      - fallback_segmentor
    translators:
      - punct_translator
      - wetype_translator
      - table_translator@custom_phrase
    filters:
      # External expression tables match the simplified engine text, so they
      # must run before any user-added OpenCC conversion. A filter listed
      # later inserts its expressions closer to the word, so the arrangement
      # below displays symbols first, then Emoji, then kaomoji.
      - lua_filter@*wetype_expressions*kaomoji
      - lua_filter@*wetype_expressions*emoji
      - lua_filter@*wetype_expressions*symbols
      - lua_filter@*wetype_candidate_rules*filter
  # Candidate page size follows Rime's default (menu/page_size in default.yaml
  # or the user's default.custom.yaml); set it there or in a scheme patch.
  speller:
    alphabet: "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ;"
    delimiter: "'"
  punctuator:
    import_preset: default
  key_binder:
    import_preset: default
    bindings:
      - { when: has_menu, accept: minus, send: Page_Up }
      - { when: has_menu, accept: equal, send: Page_Down }
  recognizer:
    import_preset: default
    patterns:
      # Uppercase input belongs to the native engine.
      uppercase: ""
  ascii_composer:
    switch_key:
      Shift_L: commit_code
      Shift_R: commit_code

  custom_phrase:
    dictionary: ""
    user_dict: custom_phrase
    db_class: stabledb
    enable_completion: false
    enable_sentence: false
    initial_quality: 99

  translator:
    dictionary: null

settings:
  __include: wetype/installation:/wetype
  # Editor context: true = 聯想 (联想), false = 獨立 (独立).
  # Set settings/surrounding in wetype_common.custom.yaml, then deploy.
  surrounding: true
  candidate_keys:
    pin: ""
    block: ""
    unpin: ""
    restore: ""
  cell_dicts: []
