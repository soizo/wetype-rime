# Rime shared settings. Personal overrides: wetype_common.custom.yaml.
# encoding: utf-8

__patch: wetype_common.custom:/patch?

base:
  engine:
    processors:
      - lua_processor@*wetype_bootstrap
      - ascii_composer
      - recognizer
      - wetype_candidate_actions
      - key_binder
      - wetype_speller
      - punctuator
      - selector
      - navigator
      - express_editor
    segmentors:
      - ascii_segmentor
      - matcher
      - abc_segmentor
      - punct_segmentor
      - fallback_segmentor
    translators:
      - punct_translator
      - wetype_translator
  menu:
    page_size: 8
  speller:
    alphabet: "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ;"
    delimiter: "'"
  punctuator:
    import_preset: default
  key_binder:
    import_preset: default
    bindings:
      - { when: has_menu, accept: minus, send: Page_Up }
      - { when: has_menu, accept: equal, send: Page_Down }
  recognizer:
    import_preset: default
    patterns:
      # Uppercase input belongs to the native engine.
      uppercase: ""
  ascii_composer:
    switch_key:
      Shift_L: commit_code
      Shift_R: commit_code

  custom_phrase:
    dictionary: ""
    user_dict: custom_phrase
    db_class: stabledb
    initial_quality: 99

  translator:
    dictionary: null

settings:
  __include: wetype/installation:/wetype
  # Editor context: true = 聯想 (联想), false = 獨立 (独立).
  # Set settings/surrounding in wetype_common.custom.yaml, then deploy.
  surrounding: true
  candidate_keys:
    pin: Control+Shift+p
    block: Control+Shift+b
    unpin: Control+Shift+r
    restore: Control+Shift+u
  cell_dicts: []
