# Merge into the relevant <schema_id>.custom.yaml, then deploy.
# Switches kaomoji and symbol_emoji back to the native engine recommendations.
# The external Lua tables (wetype_kaomoji.tsv / wetype_symbols.tsv) step aside
# automatically while the native categories are active, so nothing duplicates.
# The schemes already define the hidden kaomoji/symbol_emoji switches; this
# patch only binds them to the native engine and adds the personal shortcut
# tables below.
patch:
  wetype/kaomoji_option: kaomoji
  wetype/symbol_emoji_option: symbol_emoji
  "engine/translators/+":
    - wetype_expression_translator@kaomoji
    - wetype_expression_translator@symbol_emoji
  kaomoji:
    option_name: kaomoji
    dictionary: ""
    user_dict: kaomoji
    db_class: stabledb
    enable_completion: false
    enable_sentence: false
    initial_quality: 99
  symbol_emoji:
    option_name: symbol_emoji
    dictionary: ""
    user_dict: symbol_emoji
    db_class: stabledb
    enable_completion: false
    enable_sentence: false
    initial_quality: 99
