# Merge into the relevant <schema_id>.custom.yaml, then deploy.
# Expression options start enabled. Existing Unicode Emoji settings remain.
patch:
  wetype/kaomoji_option: kaomoji
  wetype/symbol_emoji_option: symbol_emoji
  "switches/+":
    - name: kaomoji
      reset: 1
      states: [颜文字关, 颜文字开]
    - name: symbol_emoji
      reset: 1
      states: [符号表情关, 符号表情开]
  "engine/translators/+":
    - wetype_expression_translator@kaomoji
    - wetype_expression_translator@symbol_emoji
  kaomoji:
    option_name: kaomoji
    dictionary: ""
    user_dict: kaomoji
    db_class: stabledb
    enable_completion: false
    enable_sentence: false
    initial_quality: 99
  symbol_emoji:
    option_name: symbol_emoji
    dictionary: ""
    user_dict: symbol_emoji
    db_class: stabledb
    enable_completion: false
    enable_sentence: false
    initial_quality: 99
