schema:
  schema_id: wetype
  name: wetype
  version: "0.1"
  description: 微信原生引擎、本地词库和学习，完全离线
switches:
  - name: ascii_mode
    reset: 0
    states: [中文, 英文]
  - name: wetype_surrounding
    reset: 1
    states: [前文联想关, 前文联想开]
    abbrev: [前文关, 前文开]
engine:
  processors:
    - lua_processor@*wetype_bootstrap
    - ascii_composer
    - recognizer
    - key_binder
    - wetype_speller
    - punctuator
    - selector
    - navigator
    - express_editor
  segmentors:
    - ascii_segmentor
    - matcher
    - abc_segmentor
    - punct_segmentor
    - fallback_segmentor
  translators:
    - punct_translator
    - wetype_translator
menu:
  page_size: 8
speller:
  alphabet: "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ;"
  delimiter: "'"
punctuator:
  import_preset: default
key_binder:
  bindings:
    - { when: has_menu, accept: minus, send: Page_Up }
    - { when: has_menu, accept: equal, send: Page_Down }
ascii_composer:
  switch_key:
    Shift_L: commit_code
    Shift_R: commit_code
